# Deploy: fly deploy --config appview/fly.toml
app = "micelio-appview"
primary_region = "gru"

[build]

[env]
  PORT = "8080"
  COUNTER_DB_PATH = "/data/counter.sqlite"
  EVENT_COLLECTION = "org.micelio.event"
  RSVP_COLLECTION = "org.micelio.rsvp"
  INDEXER_ENABLED = "true"
  # PDS_URL and APPVIEW_ALLOWED_ORIGINS set via `fly secrets set`/[env] once
  # the pds app and frontend URLs are known.

[mounts]
  source = "appview_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    method = "GET"
    interval = "15s"
    timeout = "5s"
