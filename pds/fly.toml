# Deploy: fly deploy --config pds/fly.toml --dockerfile none
# (app name below may need to change if taken — see setup steps)
app = "micelio-pds"
primary_region = "gru"

[build]
  image = "ghcr.io/bluesky-social/pds:0.4"

[mounts]
  source = "pds_data"
  destination = "/pds"

[env]
  PDS_DATA_DIRECTORY = "/pds"
  PDS_BLOBSTORE_DISK_LOCATION = "/pds/blocks"
  PDS_BLOB_UPLOAD_LIMIT = "314572800"
  PDS_DID_PLC_URL = "https://plc.directory"
  PDS_BSKY_APP_VIEW_URL = "https://api.bsky.app"
  PDS_BSKY_APP_VIEW_DID = "did:web:api.bsky.app"
  PDS_REPORT_SERVICE_URL = "https://mod.bsky.app"
  PDS_REPORT_SERVICE_DID = "did:plc:ar7c4by46qjdydhdevvrndac"
  PDS_CRAWLERS = "https://bsky.network"
  LOG_ENABLED = "true"
  PDS_RATE_LIMITS_ENABLED = "true"
  PDS_INVITE_REQUIRED = "true"
  # PDS_HOSTNAME added here once the final app name is confirmed (fly apps create
  # may append a suffix if "micelio-pds" is taken) — must equal "<app>.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
